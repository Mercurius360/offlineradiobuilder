name: Build

permissions:
  contents: write

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish as a GitHub Release (leave empty to only build)"
        required: false
        default: ""

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller OfflineRadioBuilder.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: OfflineRadioBuilder-windows
          path: dist/OfflineRadioBuilder.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: brew install python-tk@3.12 || true
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller OfflineRadioBuilder.spec --noconfirm
      - name: Package dmg
        run: |
          hdiutil create -volname "Offline Radio Builder" -srcfolder dist/OfflineRadioBuilder.app -ov -format UDZO OfflineRadioBuilder.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: OfflineRadioBuilder-macos
          path: OfflineRadioBuilder.dmg

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y python3-tk libfuse2
      - run: bash build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OfflineRadioBuilder-linux
          path: |
            dist/OfflineRadioBuilder
            dist/OfflineRadioBuilder-x86_64.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files
        run: |
          mkdir release
          cp artifacts/OfflineRadioBuilder-windows/OfflineRadioBuilder.exe release/OfflineRadioBuilder-windows.exe
          cp artifacts/OfflineRadioBuilder-macos/OfflineRadioBuilder.dmg release/OfflineRadioBuilder-macos.dmg
          cp artifacts/OfflineRadioBuilder-linux/OfflineRadioBuilder-x86_64.AppImage release/OfflineRadioBuilder-linux-x86_64.AppImage
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Offline Radio Builder ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: release/*
